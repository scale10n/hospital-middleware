basePath: /
definitions:
  hospital-middleware_internal_middleware.ProblemDetails:
    properties:
      detail:
        description: Human-readable explanation specific to this occurrence
        type: string
      error:
        description: Backward-compatible alias for detail
        type: string
      instance:
        description: URI reference that identifies the specific occurrence
        type: string
      status:
        description: HTTP status code generated by origin server
        type: integer
      title:
        description: Short, human-readable summary of the problem type
        type: string
      type:
        description: URI reference that identifies the problem type
        type: string
    type: object
  hospital-middleware_internal_response.Response-hospital-middleware_internal_service_PatientResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/hospital-middleware_internal_service.PatientResponse'
        description: Payload data
      message:
        description: Human-readable status message
        type: string
      status:
        description: '"success"'
        type: string
    type: object
  hospital-middleware_internal_response.Response-internal_handlers_CreateStaffOutput:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/internal_handlers.CreateStaffOutput'
        description: Payload data
      message:
        description: Human-readable status message
        type: string
      status:
        description: '"success"'
        type: string
    type: object
  hospital-middleware_internal_response.Response-internal_handlers_HealthResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/internal_handlers.HealthResponse'
        description: Payload data
      message:
        description: Human-readable status message
        type: string
      status:
        description: '"success"'
        type: string
    type: object
  hospital-middleware_internal_response.Response-internal_handlers_LoginStaffOutput:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/internal_handlers.LoginStaffOutput'
        description: Payload data
      message:
        description: Human-readable status message
        type: string
      status:
        description: '"success"'
        type: string
    type: object
  hospital-middleware_internal_response.Response-internal_handlers_PatientSearchOutput:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/internal_handlers.PatientSearchOutput'
        description: Payload data
      message:
        description: Human-readable status message
        type: string
      status:
        description: '"success"'
        type: string
    type: object
  hospital-middleware_internal_service.PatientResponse:
    properties:
      date_of_birth:
        description: Date of birth formatted as YYYY-MM-DD
        example: "2004-10-15"
        type: string
      email:
        description: Contact email address
        example: chonthicha.s@example.com
        type: string
      first_name_en:
        description: Patient first name in English
        example: Chonthicha
        type: string
      first_name_th:
        description: Patient first name in Thai
        example: ชลธิชา
        type: string
      gender:
        description: Biological gender ('M' for Male, 'F' for Female, 'O' for Other)
        example: F
        type: string
      id:
        description: Unique identifier (UUID) of the patient record
        example: e7b23c21-1234-4567-89ab-cdef01234567
        type: string
      last_name_en:
        description: Patient last name in English
        example: Sawangjit
        type: string
      last_name_th:
        description: Patient last name in Thai
        example: สว่างจิตต์
        type: string
      middle_name_en:
        description: Patient middle name in English (optional)
        example: ""
        type: string
      middle_name_th:
        description: Patient middle name in Thai (optional)
        example: ""
        type: string
      national_id:
        description: 13-digit Thai National Identification Number
        example: "1100505566779"
        type: string
      passport_id:
        description: Passport number for foreign patients
        example: ""
        type: string
      patient_hn:
        description: Hospital Number (HN) assigned to the patient within the hospital
        example: P00020
        type: string
      phone_number:
        description: Contact telephone number
        example: "0832223333"
        type: string
    type: object
  hospital-middleware_internal_service.SessionInfoResponse:
    properties:
      expires_at:
        type: string
    type: object
  hospital-middleware_internal_service.StaffInfoResponse:
    properties:
      created_at:
        type: string
      hospital_hn:
        type: string
      hospital_name:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  internal_handlers.CreateStaffOutput:
    properties:
      session:
        $ref: '#/definitions/hospital-middleware_internal_service.SessionInfoResponse'
      staff:
        $ref: '#/definitions/hospital-middleware_internal_service.StaffInfoResponse'
    type: object
  internal_handlers.CreateStaffRequest:
    properties:
      hospital:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - hospital
    - password
    - username
    type: object
  internal_handlers.HealthResponse:
    properties:
      database:
        example: connected
        type: string
      error:
        example: ""
        type: string
      status:
        example: healthy
        type: string
    type: object
  internal_handlers.LoginStaffOutput:
    properties:
      session:
        $ref: '#/definitions/hospital-middleware_internal_service.SessionInfoResponse'
      staff:
        $ref: '#/definitions/hospital-middleware_internal_service.StaffInfoResponse'
    type: object
  internal_handlers.LoginStaffRequest:
    properties:
      hospital:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - hospital
    - password
    - username
    type: object
  internal_handlers.PatientSearchOutput:
    properties:
      patients:
        description: List of matched patient records
        items:
          $ref: '#/definitions/hospital-middleware_internal_service.PatientResponse'
        type: array
      total:
        description: Total count of patients matching the criteria
        example: 1
        type: integer
    type: object
  internal_handlers.PatientSearchRequest:
    properties:
      date_of_birth:
        description: Date of birth formatted as YYYY-MM-DD (วันเกิด รูปแบบ YYYY-MM-DD)
        example: ""
        type: string
      email:
        description: Contact email address (supports case-insensitive partial match)
        example: ""
        type: string
      first_name:
        description: Patient first name in Thai or English (supports case-insensitive
          partial match)
        example: ""
        type: string
      last_name:
        description: Patient last name in Thai or English (supports case-insensitive
          partial match)
        example: ""
        type: string
      middle_name:
        description: Patient middle name in Thai or English (supports case-insensitive
          partial match)
        example: ""
        type: string
      national_id:
        description: 13-digit Thai Citizen Identification Number (เลขบัตรประชาชน 13
          หลัก)
        example: "1100505566779"
        type: string
      passport_id:
        description: Passport number for foreign patients (เลขที่หนังสือเดินทาง)
        example: ""
        type: string
      phone_number:
        description: Contact telephone number (exact match)
        example: ""
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Middleware service handling staff authentication and hospital integrations.
  title: Hospital Middleware API
  version: "1.0"
paths:
  /health:
    get:
      description: Check server and database connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-internal_handlers_HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-internal_handlers_HealthResponse'
      summary: Liveness and Readiness probe
      tags:
      - Health
  /patient/search:
    post:
      consumes:
      - application/json
      description: Search patients within the authenticated staff member's hospital.
        Multiple criteria are combined with AND logic. At least one search criterion
        must be provided. Supports partial matching for names and email, exact matching
        for IDs and phone, and YYYY-MM-DD format for date of birth.
      parameters:
      - description: Patient search criteria payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.PatientSearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful search response with list of matching patients
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-internal_handlers_PatientSearchOutput'
        "400":
          description: 'Bad request: invalid parameters or empty search criteria'
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
        "401":
          description: 'Unauthorized: missing or invalid session cookie'
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
      security:
      - CookieAuth: []
      summary: Search patients
      tags:
      - Patient
  /patient/search/{id}:
    get:
      description: Search and retrieve specific patient details by Thai National ID
        (13 digits) or Passport ID within the authenticated staff member's hospital.
      parameters:
      - description: National ID (13 digits) or Passport ID
        example: '"1100501234567"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with patient details
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-hospital-middleware_internal_service_PatientResponse'
        "400":
          description: 'Bad request: invalid national_id or passport_id format'
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
        "401":
          description: 'Unauthorized: missing or invalid session cookie'
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
        "404":
          description: 'Not found: patient does not exist'
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/hospital-middleware_internal_middleware.ProblemDetails'
      security:
      - CookieAuth: []
      summary: Search patient by National ID or Passport ID
      tags:
      - Patient
  /staff/create:
    post:
      consumes:
      - application/json
      description: Register staff with hospital affiliation, username, and secure
        password
      parameters:
      - description: Staff registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateStaffRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-internal_handlers_CreateStaffOutput'
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Username already exists
          schema:
            additionalProperties: true
            type: object
      summary: Create a new hospital staff member
      tags:
      - Staff
  /staff/login:
    post:
      consumes:
      - application/json
      description: Authenticate staff member and issue session cookie with JWT token
      parameters:
      - description: Staff login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hospital-middleware_internal_response.Response-internal_handlers_LoginStaffOutput'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid username or password
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Staff login authentication
      tags:
      - Staff
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: Session token cookie for authenticated endpoints.
    in: cookie
    name: session_token
    type: apiKey
swagger: "2.0"
