services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-middleware-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
